name: PR Preview Cleanup
on:
  pull_request_target:
    types: [closed]
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]
  workflow_dispatch:
permissions:
  actions: write
jobs:
  request-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Publication and deletion share the publisher's serialized transaction.
            await github.rest.actions.createWorkflowDispatch({...context.repo,
              workflow_id:'pr-preview.yml', ref:'main'});
