name: Publish PR Preview
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Review Control']
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: review-control
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: review-control
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
      - name: Recover pending review actions
        run: node scripts/review/controller.js reconcile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_TOKEN: ${{ steps.app.outputs.token }}
          REVIEW_BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
      - name: Select verified preview artifact
        id: preview
        run: node scripts/review/preview.js select
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_TOKEN: ${{ steps.app.outputs.token }}
          REVIEW_BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
      - uses: actions/download-artifact@v4
        if: steps.preview.outputs.number != ''
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.preview.outputs.run }}
          artifact-ids: ${{ steps.preview.outputs.artifact }}
          path: preview-artifact
          merge-multiple: true
      - name: Validate static artifact
        if: steps.preview.outputs.number != ''
        run: node scripts/review/preview.js validate preview-artifact
      - uses: peaceiris/actions-gh-pages@v4
        if: steps.preview.outputs.number != ''
        with:
          deploy_key: ${{ secrets.PREVIEW_DEPLOY_KEY }}
          external_repository: usace-rmc/RMC-Software-Documentation-Previews
          publish_branch: gh-pages
          publish_dir: preview-artifact
          destination_dir: pr-${{ steps.preview.outputs.number }}
          keep_files: true
      - name: Update persistent review summary
        if: always()
        run: node scripts/review/preview.js record
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_TOKEN: ${{ steps.app.outputs.token }}
          REVIEW_BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
          PREVIEW_NUMBER: ${{ steps.preview.outputs.number }}
          PREVIEW_SHA: ${{ steps.preview.outputs.sha }}
          PREVIEW_RESULT: ${{ job.status }}
          PREVIEW_RUN: ${{ steps.preview.outputs.run }}
          PREVIEW_ARTIFACT: ${{ steps.preview.outputs.artifact }}
      - name: Select completed previews for cleanup
        run: node scripts/review/preview.js cleanup-list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: usace-rmc/RMC-Software-Documentation-Previews
          ref: gh-pages
          ssh-key: ${{ secrets.PREVIEW_DEPLOY_KEY }}
          path: preview-site
      - name: Remove completed previews
        run: node scripts/review/preview.js cleanup preview-site
      - name: Record removed previews
        run: node scripts/review/preview.js cleanup-record
        env:
          REVIEW_TOKEN: ${{ steps.app.outputs.token }}
          REVIEW_BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
