name: CI Build
run-name: 'Validate PR #${{ github.event.pull_request.number || inputs.pr }} at ${{ github.event.pull_request.head.sha || inputs.sha }}'
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to validate (used by review automation)'
        required: true
        type: string
      sha:
        description: 'Exact PR head revision to validate'
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true
jobs:
  build:
    name: Build preview artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Resolve PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const n = context.payload.pull_request?.number || Number(context.payload.inputs?.pr);
            if (!Number.isSafeInteger(n) || n < 1) throw new Error('Invalid PR number');
            if (context.eventName === 'workflow_dispatch' && context.ref !== 'refs/heads/main') throw new Error('Dispatch from main only');
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number:n});
            if (pr.state !== 'open') throw new Error('PR is closed');
            const expected = context.payload.pull_request?.head.sha || context.payload.inputs?.sha;
            if (expected !== pr.head.sha) throw new Error('PR changed before this build started; build the latest revision');
            core.setOutput('number', String(n));
            core.setOutput('sha', pr.head.sha);
            core.setOutput('repository', pr.head.repo.full_name);
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr.outputs.repository }}
          ref: ${{ steps.pr.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:review --if-present
      - name: Build preview
        run: npm run build
        env:
          DOCUSAURUS_URL: https://usace-rmc.github.io
          DOCUSAURUS_BASE_URL: /RMC-Software-Documentation-Previews/pr-${{ steps.pr.outputs.number }}/
          DOCUSAURUS_IS_PREVIEW: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ steps.pr.outputs.number }}-${{ steps.pr.outputs.sha }}
          path: build/
          if-no-files-found: error
          retention-days: 7
    outputs:
      pr: ${{ steps.pr.outputs.number }}
      sha: ${{ steps.pr.outputs.sha }}
