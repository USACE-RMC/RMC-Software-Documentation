name: Review Control
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, review_requested, review_request_removed, closed]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ['CI Build', 'Review Signal', 'Deploy to GitHub Pages']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: review-control
  cancel-in-progress: false
jobs:
  control:
    runs-on: ubuntu-latest
    environment: review-control
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
      - name: Reconcile review policy
        run: node scripts/review/controller.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_TOKEN: ${{ steps.app.outputs.token }}
          REVIEW_BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
